unit = "cmap"
prefix = "CMAP"
title = "CMAP colour map chips of the Impact graphics subsystem"
doc = """
The two colour map chips (CMAP0 and CMAP1), each a table of 8192 entries of 24-bit colour that
turns colour-index pixels into RGB. Every register is a port in the chip's display-bus window,
so the offsets are bytes from the window start and each port's offset encodes its register
select and access width. The window address depends on the board's map and is not given here;
the broadcast window writes both chips at once. The DAC and the XMAP router on the same bus are
not covered here. Grades follow the repository legend."""
from = "driver and diagnostic readings"
public_from = ["driver and diagnostic readings"]
name_source = "ours"

[constants]
DCB_DEVICE_CMAP0 = { value = 4, grade = "established", doc = "Display-bus device number of the first chip. The kernel's and the diagnostic's reads of its revision byte land in this device's window on the Octane board map." }
DCB_DEVICE_CMAP1 = { value = 5, grade = "established", doc = "Display-bus device number of the second chip, read the same way." }
DCB_DEVICE_ALL = { value = 3, grade = "inferred", doc = "Display-bus device number of the broadcast window that writes both chips. The diagnostic writes the palette and command through a combined window and reads each chip separately; the device number comes from the chip header and no other source was read." }
ENTRIES = { value = 8192, grade = "established", doc = "Palette entries per chip. The diagnostic's address tests span all 8192; the entry counter wraps to zero after the last." }
ENTRY_BITS = { value = 24, grade = "inferred", doc = "Width of a palette entry: the diagnostic compares 24 bits of each entry read back (8 bits each of red, green and blue)." }
REVISION_MIN = { value = 2, grade = "established", doc = "Lowest revision value the diagnostic accepts; below it the diagnostic fails the check." }
REVISION_MAX_EXPECTED = { value = 4, grade = "established", doc = "Highest revision value the diagnostic knows; above it the diagnostic warns that the software may not be compatible." }
CMD_ENABLE_TIMING_PIPES = { value = 0x03, grade = "established", doc = "Value the diagnostic's timing initialisation writes to the command port; its debug message calls it enabling the timing pipes." }

[registers.addr_lo]
offset = 0x008
access = "rw"
width = 8
grade = "inferred"
doc = "Port: low byte of the palette address. Defined next to the sixteen-bit address port; no shipped use of the byte form was read."

[registers.addr]
offset = 0x030
access = "rw"
width = 16
grade = "established"
doc = "Port: palette entry address. The diagnostic and the loaders write it before a run of colour writes or reads, twice in a row as a workaround for the address being lost at random when the bus turns between writing and reading. The loaders set the address once per run of colour writes, so a write is read as stepping the address (inferred); a comment in the diagnostic says the counter wraps to zero after the last entry, and that the first read right after a write is not guaranteed, so it starts reading at the last entry and discards the first value."

[registers.addr.fields]
entry = { bits = [12, 0], grade = "inferred", doc = "Palette entry number; the address tests use bit 12 as the top bit." }

[registers.addr_hi]
offset = 0x088
access = "rw"
width = 8
grade = "inferred"
doc = "Port: high byte of the palette address. Defined next to the address port; no shipped use was read."

[registers.pal]
offset = 0x118
access = "rw"
width = 32
grade = "established"
doc = "Port: palette entry data, a three-byte access. A write stores one entry at the current address and steps it; a read returns one entry. The loaders pack red in bits 31:24, green in 23:16 and blue in 15:8, and the diagnostic's read helper unpacks the same bytes."

[registers.pal.fields]
red = { bits = [31, 24], grade = "established" }
green = { bits = [23, 16], grade = "established" }
blue = { bits = [15, 8], grade = "established" }

[[registers.pal.tests]]
value = 0x12345600
expect = { red = 0x12, green = 0x34, blue = 0x56 }

[registers.cmd]
offset = 0x188
access = "rw"
width = 8
grade = "established"
doc = "Port: command. The diagnostic writes 3 through the broadcast window to enable the timing pipes, and the standalone and kernel initialisation write a mask built from a named unmask value; a read of each chip's own copy is defined. The bit meanings are unknown."

[registers.status]
offset = 0x208
access = "r"
width = 8
grade = "established"
doc = "Port: status, read per chip. The loaders wait on it between runs of palette writes: the older builds wait until bit 3 is set and the Octane build waits until bit 2 is clear. Other bits are not read."

[registers.status.fields]
ready = { bits = [3, 3], grade = "inferred", doc = "Waited on for set by the older builds; read as FIFO ready." }
busy = { bits = [2, 2], grade = "inferred", doc = "Waited on for clear by the Octane build; read as FIFO busy." }

[registers.rev]
offset = 0x308
access = "r"
width = 8
grade = "established"
doc = "Port: chip revision, read per chip. The diagnostic masks the low three bits, requires at least REVISION_MIN, warns above REVISION_MAX_EXPECTED and requires the two chips to agree."

[registers.rev.fields]
revision = { bits = [2, 0], grade = "established" }

[registers.reserved]
offset = 0x388
access = "rw"
width = 8
grade = "inferred"
doc = "Port: defined by the software's register layout as the last select; no shipped use was read, and its role is unknown."
