HQ_VIDEO_DMA_CONTROL_OFFSET = { value = 0x081010, grade = "inferred", doc = "video DMA control word: the driver's last store before it polls is the value with bits 0 and 4 set, which starts the transfer; on timeout it stores 2 here to abort. Roles inferred from the order of stores and the timeout path", from = "Octane digital video driver, IRIX 6.5.30 build" }
HQ_VIDEO_DMA_MODE_OFFSET = { value = 0x081018, grade = "inferred", doc = "video DMA mode word, stored before the control word: low nibble forced to 0xc by the driver", from = "Octane digital video driver, IRIX 6.5.30 build" }
HQ_VIDEO_DMA_SOURCE_OFFSET = { value = 0x060018, grade = "inferred", doc = "word stored before the descriptor, built from the caller's fields (bit 2 set, bits 5:3, 1:0 and 9:6 from three caller values); meaning unknown", from = "Octane digital video driver, IRIX 6.5.30 build" }
HQ_GL_DMA_STATUS_WAIT_MASK = { value = 0x1eff, grade = "inferred", doc = "mask of DMA status bits the client waits to see clear after a DMA read; what each bit means is unknown" }
HQ_INTR_STATUS_OFFSET = { value = 0x011020, grade = "established", from = "IRIX 6.5.30 IP27 kernel", doc = "interrupt status word; the general handler reads it masked by the enable word. The switch tail writes 0x80 to it and reads bit 5 back; what the write does is unknown" }
