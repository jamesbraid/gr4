[registers.xfer_mode]
# UNSURE: header name is XFRMODE (impactreg.h:101)
name_source = "ours"
offset = 0xe159
access = "rw"
width = 32
grade = "inferred"
doc = """
Transfer mode. Placed from what the drivers write: component type in 3:0,
pixel format in 7:4, begin skip bytes in 10:8, begin skip bits in 13:11,
stride skip bytes in 16:14 (three bits in every writer read), zoom in 19,
decimate in 20, RGB order in 22, and bit 23 set for every pixel draw.
Bits 17 and 18 are one-bit flags the shipped library sets or clears (it
sets 18 in its default state and clears 17 to 20 in the copy paths); what
they do is not known, and the unpack-order and read-mask flags are among
bits 17, 18 and 21. Bit 21 is never written by software examined."""
space = "re4_regs"

[registers.xfer_mode.fields]
opaque = { bits = [23, 23], grade = "inferred" }
rgb_order = { bits = [22, 22], grade = "inferred" }
decimate = { bits = [20, 20], grade = "inferred" }
zoom = { bits = [19, 19], grade = "inferred" }
# UNSURE: the description does not name this bit
field_18 = { bits = [18, 18], grade = "inferred", doc = "Formerly flag18." }
# UNSURE: the description does not name this bit
field_17 = { bits = [17, 17], grade = "inferred", doc = "Formerly flag17." }
stride_skip_bytes = { bits = [16, 14], grade = "inferred" }
begin_skip_bits = { bits = [13, 11], grade = "inferred" }
begin_skip_bytes = { bits = [10, 8], grade = "inferred" }
comp_type = { bits = [3, 0], grade = "inferred" }

[registers.xfer_mode.fields.format]
bits = [7, 4]
grade = "inferred"

[registers.xfer_mode.fields.format.enums]
