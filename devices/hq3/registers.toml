[words.CFIFO_CTL]
width = 32
doc = """
Command-FIFO control word (bit 31 clear). The word every OpenGL library
entry point stores first; the data words follow."""
grade = "inferred"

[words.CFIFO_CTL.fields]
pixel = { bits = [31, 31], grade = "established" }
pad_flag = { bits = [30, 30], grade = "inferred" }
convert = { bits = [29, 23], grade = "established" }
kernel = { bits = [22, 22], grade = "established" }
sync = { bits = [21, 21], grade = "established" }
command = { bits = [20, 8], grade = "established" }
bytes = { bits = [7, 0], grade = "established" }

[[words.CFIFO_CTL.tests]]
value = 0x39000006
expect = { bytes = 6, command = 0, sync = 0, kernel = 0, convert = 114, pad_flag = 0, pixel = 0 }

[[words.CFIFO_CTL.tests]]
value = 0x59000004
expect = { bytes = 4, command = 0, sync = 0, kernel = 0, convert = 50, pad_flag = 1, pixel = 0 }

[words.CFIFO_INLINE]
width = 32
doc = """
Command-FIFO header of an inline data block (bit 31 set). The GL client sends
pixel rows, bitmap images and geometry-engine tables this way. The byte length
is in bits 19:0, and bits 23:22 give the offset of the first payload byte in
its word. The block then takes (offset + length + 3) / 4 words. The length
field is 20 bits wide; a reader that uses the 8-bit length of CFIFO_CTL
consumes the wrong number of words. Read from the GL client's emitters and the
kernel's table loader: a software expectation, not a board measurement."""
grade = "inferred"

[words.CFIFO_INLINE.fields]
inline = { bits = [31, 31], grade = "inferred" }
first_offset = { bits = [23, 22], grade = "inferred" }
length = { bits = [19, 0], grade = "inferred" }

[[words.CFIFO_INLINE.tests]]
kind = "example"
value = 0x80000214
expect = { inline = 1, first_offset = 0, length = 0x214 }

[words.CTX_W1]
width = 32
doc = """
Context image, word 1 (the flags word of the host-memory image the kernel
keeps per context). Bits 26 and 27 are read from the kernel's code that
writes them; 29 to 31 come from traced values and the kernel clearing them
after a load; the reader of bit 28 is not found (set only on the kernel's
own context at creation)."""
grade = "unknown"

[words.CTX_W1.fields]
first_load = { bits = [31, 31], grade = "inferred" }
nothing_saved = { bits = [30, 30], grade = "inferred" }
window_changed = { bits = [29, 29], grade = "inferred" }
bit28 = { bits = [28, 28], grade = "unknown" }
xserver_shadow = { bits = [27, 27], grade = "established" }
banks_changed = { bits = [26, 26], grade = "established" }

[[words.CTX_W1.tests]]
value = 0xc000000
expect = { banks_changed = 1, xserver_shadow = 1, bit28 = 0, first_load = 0 }

