unit = "ge11"
prefix = "GE"
title = "geometry engine control registers for the Impact graphics subsystem"
doc = "Geometry engine control registers of the Impact graphics subsystem."
from = "driver and diagnostic readings"
public_from = ["driver and diagnostic readings"]

[c]
legacy_header = "GE11_DECODE.h"
legacy_guard = "GE11_DECODE_H"

[spaces.ge11_regs]
unit = "reg"

[registers.exec_control]
offset = 0xd000
access = "rw"
width = 32
grade = "inferred"
space = "ge11_regs"

[registers.exec_control.fields]
reset = { bits = [7, 7], grade = "inferred" }
single_step = { bits = [6, 6], grade = "inferred" }
breakpoint_enable = { bits = [5, 5], grade = "inferred" }
latency3 = { bits = [4, 4], grade = "inferred" }
go = { bits = [0, 0], grade = "inferred" }

[[registers.exec_control.tests]]
value = 0x71
kind = "example"
expect = { go = 1, latency3 = 1, breakpoint_enable = 1, single_step = 1, reset = 0x0 }

[[registers.exec_control.tests]]
value = 0xc1
kind = "example"
expect = { go = 1, latency3 = 0, breakpoint_enable = 0, single_step = 1, reset = 0x1 }

