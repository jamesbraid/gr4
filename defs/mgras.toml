kind = "example"
expect = { encrs_inc = 0, endata_pack = 0, crs = 1, data_width = 1, device = 9 }

[[words.DCB_ADDR.tests]]
value = 0x2c08
kind = "example"
expect = { encrs_inc = 0, endata_pack = 0, crs = 0, data_width = 1, device = 11 }

[[words.DCB_ADDR.tests]]
value = 0x2c08
kind = "example"
expect = { encrs_inc = 0, endata_pack = 0, crs = 0, data_width = 1, device = 11 }

[[words.DCB_ADDR.tests]]
value = 0x2d08
kind = "example"
expect = { encrs_inc = 0, endata_pack = 0, crs = 2, data_width = 1, device = 11 }

[[words.DCB_ADDR.tests]]
