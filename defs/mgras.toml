unit = "mgras"
prefix = "MGRAS"
title = "board-level words of the Impact graphics subsystem"
doc = "Board-level words of the Impact graphics subsystem."
from = "driver and firmware readings"
public_from = ["driver and firmware readings", "OpenBSD impact(4) driver"]

[c]
legacy_header = "MGRAS_DECODE.h"
legacy_guard = "MGRAS_DECODE_H"

[registers.dcb_ctrl]
offset = 0xa000
access = "rw"
width = 32
grade = "inferred"
count = 12

[registers.dcb_ctrl.fields]
cs_setup = { bits = [12, 10], grade = "inferred" }
cs_hold = { bits = [8, 6], grade = "inferred" }
cs_width = { bits = [4, 2], grade = "inferred" }
async_ack = { bits = [1, 1], grade = "inferred" }
sync_ack = { bits = [0, 0], grade = "inferred" }

[[registers.dcb_ctrl.tests]]
value = 0x318
expect = { sync_ack = 0, async_ack = 0, cs_width = 6, cs_hold = 4, cs_setup = 0 }

[[registers.dcb_ctrl.tests]]
value = 0x108c
expect = { sync_ack = 0, async_ack = 0, cs_width = 3, cs_hold = 2, cs_setup = 4 }

[[registers.dcb_ctrl.tests]]
value = 0x318c
expect = { cs_width = 3, cs_hold = 6, cs_setup = 4 }

[[registers.dcb_ctrl.tests]]
value = 0x6319
expect = { sync_ack = 1, async_ack = 0, cs_width = 6, cs_hold = 4, cs_setup = 0 }

[[registers.dcb_ctrl.tests]]
value = 0x631a
expect = { sync_ack = 0, async_ack = 1, cs_width = 6, cs_hold = 4, cs_setup = 0 }

[words.BDVERS2]
width = 32
doc = """
Second board-version word, read 0x62488 above the board register
base: the start of device 9's window, register select 1, one-byte width. The
kernel's board-information routine loads it as a word and works only on its
top byte (the first byte at that address). Bits 30:29 of the word, bits 6:5
of that byte, are the product field. The value 1 takes the path with one
engine and no second board, which is how a Solid Impact board is told from
the others. Established from the routine's machine words, in the kernel
object of the base distribution's graphics module; not a bus measurement.
Bits 1:0 and 4:2 of the byte are the GE count and the MGRAS revision (fields
below). How board revision numbers map to products is inferred."""
grade = "established"

[words.BDVERS2.fields.product]
bits = [30, 29]
grade = "established"

[words.BDVERS2.fields.product.enums]
indigo2_gio = { value = 0, grade = "inferred" }
solid_impact = { value = 1, grade = "established" }
single_ge_textured = { value = 2, grade = "inferred" }
two_ge = { value = 3, grade = "inferred" }

[words.BDVERS2.fields.ge_count]
bits = [25, 24]
grade = "inferred"

[words.BDVERS2.fields.mgras_revision]
bits = [28, 26]
grade = "inferred"

[[words.BDVERS2.tests]]
value = 0x20000000
kind = "example"
expect = { product = 1 }

[words.DCB_ADDR]
width = 32
grade = "inferred"

[words.DCB_ADDR.fields]
device = { bits = [14, 10], grade = "inferred" }
crs = { bits = [9, 7], grade = "inferred" }
endata_pack = { bits = [6, 6], grade = "inferred" }
encrs_inc = { bits = [5, 5], grade = "inferred" }

[words.DCB_ADDR.fields.data_width]
bits = [4, 3]
grade = "inferred"

[words.DCB_ADDR.fields.data_width.enums]
four_bytes = { value = 0, grade = "inferred" }
one_byte = { value = 1, grade = "inferred" }
two_bytes = { value = 2, grade = "inferred" }
three_bytes = { value = 3, grade = "inferred" }

[[words.DCB_ADDR.tests]]
