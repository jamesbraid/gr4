[project]
name = "gr4"

[checks]
address_bits = 16

[allowlists]
leak = "tools/config/leak-allow.txt"

[units.re4]
notes_corpus = ["devices/re4/RE4.h"]

[units.hq3]
notes_corpus = ["devices/hq3/HQ3.h"]

[units.mgras]
notes_corpus = ["devices/mgras/MGRAS.h"]

[units.xtalk]
prose_offsets = false

[units.pp1]
notes_corpus = ["devices/pp1/PP1.h", "questions/README.md"]

[[claims]]
group = "re4"
label = "config y flip bit"
doc = "devices/re4/RE4.h"
regex = 'RE4_CFG_YFLIP\s+BIT\((\d+)\)'
binds = [
  ["F", "RE.config.y_flip", 1],
]

[[claims]]
group = "re4"
label = "fill mode block type position"
doc = "devices/re4/RE4.h"
regex = 'RE4_FM_BLOCK_TYPE_MASK\s+\(0x7 << (\d+)\)'
binds = [
  ["LO", "RE.fill_mode.block_type", 1, 0],
]

[[claims]]
group = "re4"
label = "instruction setup bit"
doc = "devices/re4/RE4.h"
regex = 'RE4_IR_SETUP\s+BIT\((\d+)\)'
binds = [
  ["F", "RE.instr.setup", 1],
]

[[claims]]
group = "hq3"
label = "bus config tlb update bit"
doc = "devices/hq3/HQ3.h"
regex = 'HQ3_GIOCFG_TLB_UPDATE\s+BIT\((\d+)\)'
binds = [
  ["F", "HQ.gio_config.tlb_update", 1],
]

[[claims]]
group = "ge11"
label = "exec breakpoint enable bit"
doc = "devices/ge11/GE11.h"
regex = 'GE11_EXEC_BREAKPOINT_EN\s+BIT\((\d+)\)'
binds = [
  ["F", "GE.exec_control.breakpoint_enable", 1],
]

[[claims]]
group = "mgras"
label = "board id revision nibble"
doc = "devices/mgras/MGRAS.h"
regex = 'MGRAS_REV_MASK\s+0x0000000?(F)0'
binds = [
  ["WHEX", "GIO_ID.revision", 1],
]
